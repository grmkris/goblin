[package]
name = "goblin-gpui-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "=0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
smol = "2"

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
