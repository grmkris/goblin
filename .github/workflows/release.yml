name: Release dev
on:
  workflow_run:
    workflows: [Check]
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full dev SHA to retry after a successful Check
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: goblin-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: [self-hosted, linux, x64, netcup]
    environment: dev
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      GOBLIN_RELEASE_ROOT: /var/lib/goblin-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Prepare shared heavy runtime
        run: |
          runtime="/tmp/goblin-heavy-$(id -u)"
          if [ -e "$runtime" ] && [ ! -O "$runtime" ]; then
            echo "heavy_runtime_not_owned" >&2
            exit 1
          fi
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - name: Materialize private stage credentials
        env:
          STAGE_ENV: ${{ secrets.GOBLIN_STAGE_ENV }}
          CLOUD_ENV: ${{ secrets.GOBLIN_CLOUD_ENV }}
          OWNER_SESSION: ${{ secrets.GOBLIN_SMOKE_SESSION }}
        run: python3 -B scripts/ci_credentials.py dev
      - name: Deploy and verify exact dev commit
        run: heavy python3 -B scripts/release.py dev "$RELEASE_SHA"
      - name: Remove transient credentials
        if: always()
        run: python3 -B scripts/ci_credentials.py dev --cleanup
